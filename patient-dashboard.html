<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MercyCare Hospital | Patient Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="patient-dashboard">
  <nav class="navbar navbar-expand-lg navbar-light border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html"><i class="bi bi-heart-pulse-fill me-2"></i>MercyCare</a>
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-outline-primary btn-sm" href="appointment.html">New appointment</a>
        <button class="btn btn-primary btn-sm" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>
  </nav>
  <main class="py-5">
    <div class="container" id="patientDashboardRoot"></div>
  </main>

  <div class="modal fade" id="rescheduleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0">
          <h5 class="modal-title">Reschedule appointment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="rescheduleAppointmentId">
          <div class="mb-3">
            <label class="form-label">New date</label>
            <input type="date" id="rescheduleDate" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">New time</label>
            <select id="rescheduleTime" class="form-select"></select>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" id="saveRescheduleBtn" type="button">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/appointments.js"></script>
</body>
</html>
